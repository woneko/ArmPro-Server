name: Java Gradle CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"  # 禁用守护进程
  JAVA_OPTS: "-Xmx2048m -Xms512m"

jobs:
  # 1. 代码质量检查
  code-quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
        
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle
          
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1
        
      - name: Run code quality checks
        run: |
          chmod +x gradlew
          ./gradlew check
          ./gradlew test
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 30

  # 2. 构建和打包
  build:
    runs-on: ubuntu-latest
    needs: code-quality
    if: success()
    
    strategy:
      matrix:
        # 可以构建不同 Java 版本
        java-version: [8, 11, 17]
        
    steps:
      - uses: actions/checkout@v4
        
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: gradle
          
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test
          
      - name: List build outputs
        run: ls -la build/libs/
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armardillo-server-java-${{ matrix.java-version }}
          path: |
            build/libs/*.jar
            build/distributions/*.zip
          retention-days: 7

  # 3. 数据库代码生成（可选）
  mybatis-generate:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
        
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Set up MySQL for MyBatis Generator
        run: |
          # 检查数据库配置文件是否存在
          if [ -f "src/main/resources/mybatis/config.properties" ]; then
            echo "MyBatis config file exists"
            cat src/main/resources/mybatis/config.properties
          else
            echo "MyBatis config file not found, skipping generation"
            exit 0
          fi
          
      - name: Run MyBatis Generator
        env:
          # 从 GitHub Secrets 读取数据库配置
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          chmod +x gradlew
          
          # 创建临时的配置文件（如果使用环境变量）
          if [ -n "$DB_HOST" ]; then
            echo "Generating MyBatis code with env variables..."
            ./gradlew mybatisGenerate
          else
            echo "DB credentials not set, using existing config"
            if [ -f "src/main/resources/mybatis/config.properties" ]; then
              ./gradlew mybatisGenerate
            fi
          fi
          
      - name: Commit generated code
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/main/java/** src/main/resources/mybatis/mapper/**
          git diff --cached --quiet || git commit -m "chore: auto-generate MyBatis code [skip ci]"
          git push origin HEAD:${{ github.ref }}

  # 4. 发布版本
  release:
    runs-on: ubuntu-latest
    needs: [build, mybatis-generate]
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write
      packages: write
      
    steps:
      - uses: actions/checkout@v4
        
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle
          
      - name: Extract version from tag
        id: get-version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"  # 移除 v 前缀
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
      - name: Build release
        run: |
          chmod +x gradlew
          # 使用标签版本替换 snapshot
          sed -i "s/version = '.*'/version = '${{ env.VERSION }}'/" build.gradle
          ./gradlew clean build -x test
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Armardillo Server ${{ github.ref_name }}
            
            ### Changes
            Auto-generated release.
            
            ### Downloads
            Built JAR files are attached.
            
            ### Build Info
            - Java Version: 8
            - Build Date: $(date +%Y-%m-%d)
          files: |
            build/libs/*.jar
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          
      - name: Upload to Maven Repository (可选)
        if: success()
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_REPO_URL: ${{ secrets.MAVEN_REPO_URL }}
        run: |
          echo "Would publish to Maven repository"
          # ./gradlew publish
